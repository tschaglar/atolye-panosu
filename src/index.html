<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atölye">
<title>Atölye Panosu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
<script>window.ATOLYE_CONFIG=__CONFIG__;</script>
</head>
<body>
<div lang="tr">
  <header class="top">
    <div class="wrap top-in">
      <div class="brand">
        <span class="mark" aria-hidden="true">AP</span>
        <div><div class="brand-n">Atölye Panosu</div><div class="brand-d" id="hdrDate"></div></div>
      </div>
      <button class="me-chip" id="meChip" data-act="me" hidden><span class="av sm" id="meAv"></span><span id="meName"></span></button>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <nav class="tabs" id="tabs" hidden aria-label="Bölümler"><div class="tabs-in" id="tabsIn"></div></nav>
  <button class="fab" id="fab" data-act="fab" aria-label="Görev, iş girişi ya da firma ekle" hidden></button>

  <div class="sheet-wrap" id="sheetWrap" hidden>
    <div class="backdrop" data-act="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
  </div>
  <div class="toasts" id="toasts"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
